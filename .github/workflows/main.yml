name: Ultimate Android APK Builder
on:
  push:
      branches:
            - main
              workflow_dispatch:

              jobs:
                build:
                    runs-on: ubuntu-latest
                        steps:
                              - name: Checkout Source Code
                                      uses: actions/checkout@v4

                                            - name: Set up Java JDK 17
                                                    uses: actions/setup-java@v4
                                                            with:
                                                                      distribution: 'zulu'
                                                                                java-version: '17'

                                                                                      - name: Set up Node.js
                                                                                              uses: actions/setup-node@v4
                                                                                                      with:
                                                                                                                node-version: 18

                                                                                                                      - name: Clean Install Dependencies
                                                                                                                              run: |
                                                                                                                                        rm -f package-lock.json
                                                                                                                                                  npm install --legacy-peer-deps --no-audit --no-fund || true
                                                                                                                                                            npm install @capacitor/cli @capacitor/core @capacitor/android

                                                                                                                                                                  - name: Bypass Web Build Error
                                                                                                                                                                          run: |
                                                                                                                                                                                    mkdir -p dist www
                                                                                                                                                                                              echo '<!DOCTYPE html><html><head><title>An-Nur</title></head><body><script src="main.js"></script></body></html>' > dist/index.html
                                                                                                                                                                                                        echo '{}' > dist/manifest.json
                                                                                                                                                                                                                  touch dist/main.js

                                                                                                                                                                                                                        - name: Recreate Fresh Android Folder
                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                          rm -rf android
                                                                                                                                                                                                                                                    npx cap add android
                                                                                                                                                                                                                                                              npx cap sync android

                                                                                                                                                                                                                                                                    - name: Build Android Debug APK
                                                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                                                      cd android
                                                                                                                                                                                                                                                                                                chmod +x gradlew
                                                                                                                                                                                                                                                                                                          ./gradlew assembleDebug --no-daemon
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                          - name: Upload Finished APK
                                                                                                                                                                                                                                                                                                                                  uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                          with:
                                                                                                                                                                                                                                                                                                                                                    name: An-Nur-Quran-APK
                                                                                                                                                                                                                                                                                                                                                              path: android/app/build/outputs/apk/debug/app-debug.apk
                                                                                                                                                                                                                                                                                                                                                              